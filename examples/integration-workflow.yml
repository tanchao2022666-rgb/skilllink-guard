# Copy the workflow from README.md and replace its OWNER placeholder after
# the maintainer publishes a repository and v0.1.0 tag. For a checked-out local
# copy of this action, this workflow demonstrates the same inputs.
name: Check Agent Skill resources (local action example)
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: ./
        with:
          path: examples/good-skill
