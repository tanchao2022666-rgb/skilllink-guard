name: SkillLink Guard
description: Statically check Skill local resources and common script targets
inputs:
  path:
    description: SKILL.md, Skill directory, or repository to scan
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Install SkillLink Guard
      shell: bash
      env:
        SKILLLINK_ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install -- "$SKILLLINK_ACTION_PATH"
    - name: Check local resources
      shell: bash
      env:
        SKILLLINK_INPUT_PATH: ${{ inputs.path }}
      run: python -m skilllink_guard check --format github -- "$SKILLLINK_INPUT_PATH"
